[package]
name = "native-helper"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native helper for the desktop client: per-process audio capture, global key bindings and Moonlight streams"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
hex = "0.4"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
sha2 = "0.10"
wasapi = "0.19"
x509-cert = { version = "0.2", features = ["pem", "builder"] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[build-dependencies]
cc = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
