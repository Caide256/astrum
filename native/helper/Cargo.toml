[package]
name = "native-helper"
version = "0.2.0"
edition = "2021"
description = "Native helper for the desktop client: per-process audio capture and global key bindings"

[dependencies]
wasapi = "0.19"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
